[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ide-sandbox"
version = "0.2.0"
description = "Local multi-agent coding sandbox with LOGOS planning, a code guard and a web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-ide = "run_web_ui:main"
agent-ide-bench = "agent_core.bench:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
bench = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["agent_core*", "server*", "web*"]

[tool.setuptools]
py-modules = ["run_web_ui"]

[tool.setuptools.package-data]
web = ["index.html", "css/*.css", "js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.txt"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["E402", "E741", "B904", "B905", "B007", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Typing debt in legacy modules; excluded from the CI gate (see docs/LIMITATIONS.md).
[[tool.mypy.overrides]]
module = [
    "agent_core.llm.cloud_providers", "agent_core.llm.mock_provider",
    "agent_core.llm.ollama_launcher", "agent_core.llm.registry",
    "agent_core.logos.fractal_mera", "agent_core.memory", "agent_core.orchestrator",
    "agent_core.tools", "agent_core.typesafe_jev",
]
ignore_errors = true
